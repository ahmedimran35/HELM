# HELM frontend — nginx serving config.
#
# Serves the built SPA (dist/) and reverse-proxies the backend-owned
# paths to the `api` service. Mirrors the dev-proxy rules in
# frontend/vite.config.ts:
#   /api          → api (incl. WebSocket upgrades)
#   /apps-embed   → api when ?slug= is present; bare path is the SPA
#   /apps/<slug>/ → api; bare /apps and /apps/ are the React route
#
# Hardening follows scripts/waf-nginx.conf: no version leak, strict
# caching for hashed assets only, HTML never cached (session-dependent
# shells), body-size cap above the backend's 25MB upload limit.

# WebSocket Connection header — standard map used by the proxy blocks.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# /apps-embed is only backend-owned when a slug query param exists;
# otherwise it belongs to the SPA (vite.config.ts bypass parity).
# 0 = has ?slug= → backend; 1 = no slug → SPA shell.
map $args $embed_has_slug {
  default                  1;
  ~(^|.*&)slug=[^&]+(&|$)  0;
}

server {
  listen 8080;
  server_name _;

  # No version leak in headers or error pages.
  server_tokens off;

  client_max_body_size 26m;

  # ---- API proxy --------------------------------------------------
  # All /api traffic goes to the backend. Long read timeout for SSE
  # chat streams (the backend idles connections at 240s).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 60s;
    # WebSocket upgrade (panel chat at /api/ws/panels/:id).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # ---- Apps platform (backend-served) ------------------------------
  # Exact matches first: the bare /apps and /apps/ paths are the React
  # route (the app gallery), NOT the backend bundle server. Everything
  # else under /apps/ goes to the backend — including /apps/_sdk.js
  # (underscore slug, deliberately not matched by the backend's slug
  # charset) and every per-app bundle path.
  location = /apps {
    try_files /index.html =404;
  }
  location = /apps/ {
    try_files /index.html =404;
  }
  location /apps/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # /apps-embed: proxy to the backend only when ?slug= is present.
  location = /apps-embed {
    if ($embed_has_slug = 0) {
      proxy_pass http://api:3000;
    }
    # No slug → SPA shell (React Router's catch-all redirects home).
    rewrite ^ /index.html last;
  }

  # ---- Static SPA --------------------------------------------------
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets — cache hard, they are content-addressed.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # theme-init.js runs before the app boots and reads localStorage —
  # it must never be served stale across releases.
  location = /theme-init.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Everything else: SPA fallback to index.html. HTML is never cached
  # (the shell varies with session state and future CSP nonces).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
