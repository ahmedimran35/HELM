<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>HELM</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!--
      Content-Security-Policy. The shell must:
        - run the theme bootstrap (/theme-init.js, external so script-src
          needs no 'unsafe-inline')
        - load Google Fonts stylesheet (style-src https://fonts.googleapis.com)
        - serve woff2 files from gstatic (font-src https://fonts.gstatic.com)
        - talk to the API at /api/* and ws://… for live panels
            (connect-src 'self' http://localhost:3000 ws://localhost:3000
              — production must override to the real API/WS origin)
        - never be embedded (frame-ancestors 'none')
      DEFAULT API ORIGIN IS THE DEV ONE. Production must rebuild with
      API_URL set so the meta tag ships the correct origin.

      Two parallel policies:
        * The strict Content-Security-Policy ENFORCES the rules.
        * The Content-Security-Policy-Report-Only mirror REPORTS
          violations to /api/csp-report without blocking. When we
          roll out a new directive we can flip it from report-only to
          enforced and watch the report stream for fallout BEFORE the
          switch.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' http://localhost:3000 ws://localhost:3000 wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report;"
    />
    <meta
      http-equiv="Content-Security-Policy-Report-Only"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' http://localhost:3000 ws://localhost:3000 wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri /api/csp-report;"
    />
    <!-- Theme bootstrap — external script (CSP: script-src 'self'). -->
    <script src="/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
<body class="font-body">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
