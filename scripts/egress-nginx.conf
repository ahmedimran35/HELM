# ============================================================================
# egress-nginx.conf — forward proxy for the api container's HTTPS traffic.
# ============================================================================
#
# Layer 2 of the egress lockdown (see EGRESS-FIREWALL.md). Layer 1 is
# iptables on the api container; layer 2 is this nginx on the host,
# exposed only on 127.0.0.1:3128 so containers can't reach the public
# internet except via the proxy.
#
# Behaviour:
#   * Domain allow-list. Every other domain returns 403.
#   * Uses `proxy_pass $scheme://$host$request_uri;` so HTTPS works.
#   * DNS via resolver 8.8.8.8 / 1.1.1.1 (override in resolver block if
#     you have a private resolver).
#
# Wiring it up
# ------------
# 1. Copy this file to /etc/nginx/conf.d/egress-proxy.conf on the host.
# 2. Validate and reload: `sudo nginx -t && sudo systemctl reload nginx`.
# 3. On the api container, set HTTPS_PROXY=http://host.docker.internal:3128.
# 4. Run the iptables snippet at the bottom of this file on the host.
#    It blocks the api container from reaching 443 directly and forces
#    it through the proxy port.

# ----------------------------------------------------------------------------
# Resolver — override if you run a private recursive resolver. Multiple
# entries are tried in order and the picked one is rotated transparently.
# ----------------------------------------------------------------------------
resolver 8.8.8.8 1.1.1.1 ipv6=off valid=300s;
resolver_timeout 10s;

# ----------------------------------------------------------------------------
# Forward proxy server.
#
# `listen 127.0.0.1:3128` binds to localhost only — the docker bridge
# is reachable via host.docker.internal (Docker Desktop) or the host
# gateway IP (Linux). On Linux Docker, set HTTPS_PROXY=http://172.17.0.1:3128.
# ----------------------------------------------------------------------------
server {
    listen 127.0.0.1:3128;
    server_name _;

    access_log /var/log/nginx/egress-proxy.access.log;
    error_log  /var/log/nginx/egress-proxy.error.log warn;

    # The CONNECT method is what browsers / fetch libraries use to
    # establish a TLS tunnel through an HTTP proxy. We have to
    # explicitly allow it (HTTP/1.1 RFC 7231 §4.3.6).
    #
    # Domain filtering happens at the *resolved* IP level for HTTPS
    # CONNECT (we can't see the Host header inside the tunnel), so the
    # CONNECT block matches against the dialed host *before* the
    # tunnel is established.
    #
    # For plain HTTP we use the `if ($host ~ ...)` allow-list.

    # ---- HTTPS (CONNECT method) -----------------------------------------
    # Order matters: the first matching `if` wins.
    location / {
        # Block everything by default — return 403 for any host not on
        # the allow-list. Tunnelled HTTPS never reaches an upstream
        # proxy_pass; nginx terminates the CONNECT with 403.
        if ($host ~* ^(?:.*\.)?tavily\.com$) {
            proxy_pass $scheme://$host$request_uri;
            break;
        }
        if ($host ~* ^(?:.*\.)?anthropic\.com$) {
            proxy_pass $scheme://$host$request_uri;
            break;
        }
        if ($host ~* ^(?:.*\.)?openai\.com$) {
            proxy_pass $scheme://$host$request_uri;
            break;
        }
        if ($host ~* ^(?:.*\.)?slack\.com$) {
            proxy_pass $scheme://$host$request_uri;
            break;
        }
        if ($host ~* ^(?:.*\.)?googleapis\.com$) {
            proxy_pass $scheme://$host$request_uri;
            break;
        }
        if ($host ~* ^(?:.*\.)?gstatic\.com$) {
            proxy_pass $scheme://$host$request_uri;
            break;
        }
        # Add more allow-list entries above this line. Format:
        #   if ($host ~* ^(?:.*\.)?yourdomain\.com$) { proxy_pass ... ; break; }
        return 403;
    }

    # ---- Generic HTTP proxy_pass for explicit http:// URLs -------------
    # Used by `curl http://example.com/...` style calls. The Host header
    # is visible here so the same allow-list applies.
    location ~ ^/proxy/(.+) {
        internal;
        proxy_pass $1$request_uri;
        proxy_set_header Host $host;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
    }

    # ---- Standard proxy buffers / timeouts ------------------------------
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Proxy-Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    proxy_buffer_size        16k;
    proxy_buffers            8 16k;
    proxy_busy_buffers_size  32k;

    # Don't leak the host's version in the error page.
    server_tokens off;
}

# ----------------------------------------------------------------------------
# setup.sh — host iptables rules that force the api container through
# this proxy. Run as root on the host (NOT inside the container).
#
#   sudo ./setup.sh
#
# Replace `api` below with the actual container name or the
# `docker inspect` SourceIP / network gateway IP.
# ----------------------------------------------------------------------------
# ----- cut here: scripts/egress-proxy-setup.sh ------------------------------
# #!/usr/bin/env bash
# set -euo pipefail
#
# # Container network identifier. Find yours with:
# #   docker network inspect bridge | jq -r '.[0].Containers | keys'
# # Then derive its IP via `docker inspect <container>` -> NetworkSettings.
# # We pin on 172.17.0.0/16 (the default bridge) for simplicity; tighten
# # to the single IP for production.
# API_SUBNET="172.17.0.0/16"
# PROXY_PORT=3128
#
# # Allow api -> proxy.
# iptables -C DOCKER-USER -s "$API_SUBNET" -p tcp --dport "$PROXY_PORT" \
#     -j ACCEPT 2>/dev/null || iptables -I DOCKER-USER 1 \
#     -s "$API_SUBNET" -p tcp --dport "$PROXY_PORT" -j ACCEPT
#
# # Reject api -> anywhere else on 443 so a compromised container can't
# # bypass the proxy. The proxy talks to the public internet directly
# # via the host's routing table; the api container can't.
# iptables -C DOCKER-USER -s "$API_SUBNET" -p tcp --dport 443 \
#     -j REJECT --reject-with tcp-reset 2>/dev/null || iptables -I DOCKER-USER 1 \
#     -s "$API_SUBNET" -p tcp --dport 443 \
#     -j REJECT --reject-with tcp-reset
#
# echo "[egress-proxy] api -> 443 is REJECT-with-reset; api -> $PROXY_PORT is ACCEPT"
