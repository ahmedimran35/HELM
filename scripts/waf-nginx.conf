# ============================================================================
# waf-nginx.conf — front-door TLS termination + OWASP Core Rule Set
# ============================================================================
#
# Drop-in config for the helm-front nginx container. Listens on :443 and
# terminates TLS, runs modsecurity (OWASP CRS) on every request, and
# reverse-proxies to the api container.
#
# Prereqs on the host (Ubuntu 22.04+ or Debian 12+):
#   apt-get install -y nginx libnginx-mod-http-modsecurity \
#                       modsecurity-crs
# Or, on a container:
#   FROM nginx:1.27
#   RUN apt-get update && apt-get install -y libnginx-mod-http-modsecurity \
#       modsecurity-crs && rm -rf /var/lib/apt/lists/*
#
# CRS paths (Debian/Ubuntu package) live under
#   /etc/modsecurity/crs/
# If you build from source they live under
#   /usr/local/lib/modsecurity-crs/  — adjust paths accordingly.
#
# Logging:
#   * ModSecurity audit log: /var/log/nginx/modsecurity_audit.log
#   * Standard nginx access log: /var/log/nginx/access.log
#   * Errors:                   /var/log/nginx/error.log
#
# Quick start
# -----------
#   sudo cp waf-nginx.conf /etc/nginx/sites-available/helm-front
#   sudo ln -s /etc/nginx/sites-available/helm-front /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# See HARDENING.md and SECURITY-SCORE-9.5.md for the full hardening
# posture this file implements.

# Pull in the global modsecurity directives. We override them per-server.
# The package ships /etc/nginx/modsecurity/modsecurity.conf — if you're
# building from source, point this at the equivalent file.
include /etc/nginx/modsecurity/modsecurity.conf;

# Upstream — the api container. Adjust the resolver / port to match
# your compose / k8s layout. Using `resolve` (nginx-plus) is also valid
# if you have it licensed.
upstream helm_api {
    server api:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Rate-limit zone shared across all vhosts. 10 r/s burst 20; tighten in
# the security-headers middleware too (per-user limits).
limit_req_zone $binary_remote_addr zone=helm_global:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=helm_conn:10m;

# Map a path into a CRS rule exclusion (e.g. webhooks that legitimately
# carry JSON bodies flagged by CRS). Add as needed; the default is empty.
map $uri $crs_exclusion_id {
    default 0;
    # /api/slack/events 1;
}

server {
    listen 80 default_server;
    server_name _;
    # Force HTTPS on the :80 listener. We also redirect ACME http-01
    # challenges via /.well-known/acme-challenge/.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    server_name _;

    # ---- TLS ------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # HSTS preload — 2 years, include subdomains, preload-eligible.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---- Certs ---------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/$host/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$host/privkey.pem;

    # ---- ModSecurity / OWASP CRS ---------------------------------------
    # `modsecurity on` enables the engine for this vhost. We use the
    # recommended CRS setup file (sets anomaly scoring, paranoia, etc.)
    # and load REQUEST-900 (exclusions) + the rest of the rule set.
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity/crs/crs-setup.conf;
    include /etc/nginx/modsecurity/crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf;
    include /etc/nginx/modsecurity/crs/rules/REQUEST-*.conf;

    # ---- Rate limits ---------------------------------------------------
    limit_req  zone=helm_global burst=20 nodelay;
    limit_conn helm_conn 50;

    # ---- Reverse proxy -------------------------------------------------
    location / {
        proxy_pass http://helm_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffer_size        16k;
        proxy_buffers            8 16k;
        proxy_busy_buffers_size  32k;
    }

    # ---- Health (no rate limit / no WAF scan) --------------------------
    location = /api/health/deep {
        access_log off;
        limit_req  off;
        limit_conn off;
        proxy_pass http://helm_api;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    server_tokens off;
}

# Direct the modsecurity audit log to a separate file so the standard
# nginx logrotate doesn't rotate it under heavy WAF load. (You need
# to add a logrotate snippet for /var/log/nginx/modsecurity_audit.log.)
# We do this via the global modsecurity.conf:
#
#   SecAuditLog /var/log/nginx/modsecurity_audit.log
#   SecAuditLogFormat JSON
#   SecAuditLogRelevantStatus "^(?:5|4(?!04))"
#   SecAuditEngine RelevantOnly
#
# Already set in /etc/nginx/modsecurity/modsecurity.conf on Debian;
# double-check before deploying.