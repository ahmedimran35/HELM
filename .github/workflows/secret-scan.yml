# secret-scan.yml — gitleaks on every push + PR.
#
# Catches accidentally-committed API keys, .env dumps, private keys,
# and other secrets BEFORE they hit GitHub history. Runs as a separate
# job so a gitleaks failure blocks the PR even if other CI checks
# haven't finished yet.
#
# IMPORTANT: this is a defense-in-depth layer. The real protection is
# `.gitignore` covering `.env`, `.env.*`, and any secret-shaped files
# (PR review should also catch commits that bypass .gitignore). For
# accounts that already pushed a secret, rotate the secret immediately
# — git history is not a secret manager.

name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so gitleaks can scan old commits too.
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # Fail the build if any leak is found. Default threshold is
          # 0 (fail on any finding); make it explicit so the intent
          # is obvious to future maintainers.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
