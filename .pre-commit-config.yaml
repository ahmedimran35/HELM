# .pre-commit-config.yaml — local pre-commit hooks.
#
# Install once with:
#   pipx install pre-commit
#   pre-commit install
#
# Runs gitleaks on every `git commit` so secrets NEVER reach the
# repo. This is the developer-side mirror of the .github/workflows/
# secret-scan.yml workflow — they share the same gitleaks ruleset
# and catch the same leaks at two different layers.
#
# Note: the --redact flag means gitleaks prints `[REDACTED]` instead
# of the secret value when it finds a leak. This prevents the secret
# from leaking into the terminal scrollback / CI logs.
#
# The prettier hook reformats `.ts/.tsx/.json/.md/.yml/.yaml` files
# on commit using the repo's `.prettierrc` settings. Run `pre-commit
# run --all-files` to back-fill formatting across the whole tree.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ["--redact"]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        files: \.(ts|tsx|json|md|yml|yaml)$
