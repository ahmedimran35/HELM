# docker-compose.yml — zero-config deployment for HELM
#
# Brings up the whole stack with one command:
#   docker compose up -d
#
# Services:
#   postgres     Postgres 16 database
#   redis        Redis 7 (quotas / future WS pub/sub)
#   lightpanda   Headless browser (Zig + V8) — the live-data web
#                search engine. The api container reaches it at
#                http://lightpanda:9222 (CDP). The api auto-configures
#                it on first boot if no provider is configured yet.
#   api          HELM backend (Hono on Bun)
#   web          HELM frontend (nginx serving the built SPA,
#                reverse-proxying /api + /apps to the api)
#
# The api container runs migrations on startup, seeds the admin account
# from $ADMIN_USERNAME / $ADMIN_PASSWORD, and auto-configures Lightpanda
# as the web-search provider so the org has free, real-data search out
# of the box. End users never see a provider name.

services:
  postgres:
    # NOTE: dev-only default password "helm_dev". The prod overlay
    # (docker-compose.prod.yml) requires POSTGRES_PASSWORD to be set
    # via env and removes this default.
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: helm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helm_dev}
      POSTGRES_DB: helm
    volumes:
      - helm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helm -d helm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # NOTE: dev-only default password "helm_dev" matches the redis
    # service's --requirepass below AND the REDIS_URL in the api env.
    # To run in any non-local environment, set REDIS_PASSWORD in .env
    # (the api service will fail to connect if this is overridden
    # without also updating REDIS_URL).
    image: redis:7
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - ${REDIS_PASSWORD:-helm_dev}
      # bind to all interfaces inside the docker network so the api
      # container can reach it; refuse external connections.
      - --bind
      - 0.0.0.0
      - --protected-mode
      - "yes"
    volumes:
      - helm_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-helm_dev}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Lightpanda headless browser — 9x faster and 16x less memory than
  # Headless Chrome per the project's own benchmarks. Provides real-data
  # web search by rendering pages (JS, dynamic SPAs, cookie banners)
  # before extracting content. Completely free, no API key.
  # The api container reaches it on the internal Docker network.
  # To use a remote Lightpanda instance instead, override LIGHTPANDA_BIN
  # and/or WEB_SEARCH_LIGHTPANDA_URL on the api service.
  #
  # Pinned to 0.3.7 (latest stable as of 2026-08-18). The upstream
  # `:nightly` tag is a rolling build — never use it for reproducible
  # deployments. Bump the version explicitly when upgrading.
  lightpanda:
    image: lightpanda/browser:0.3.7
    restart: unless-stopped
    # CDP server on 9222 (the default). To switch to CLI mode, set
    # LIGHTPANDA_BIN=lightpanda on api and remove the ports block.
    command: ["serve", "--host", "0.0.0.0", "--port", "9222"]
    # SECURITY: do NOT publish port 9222 to the host. CDP (Chrome DevTools
    # Protocol) is unauthenticated remote browser control — anyone who can
    # reach the port can navigate the browser to internal URLs (SSRF into
    # cloud metadata endpoints, internal services, etc.). The api service
    # reaches lightpanda over the internal compose network at
    # http://lightpanda:9222, so no host port mapping is needed.
    expose:
      - "9222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    # Build context MUST be the repo root: the Dockerfile COPYs
    # package.json + bun.lock from the root and backend/ as a
    # subdirectory (mirroring how CI and the prod overlay build it).
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lightpanda:
        condition: service_started
    healthcheck:
      # Deep probe: hits /api/health/deep, which verifies DB +
      # harnesses in addition to the basic ping. Keeps compose's
      # `service_healthy` signal aligned with what `/status` reports
      # so `docker compose ps` and the admin panel agree.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/deep"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      # -------------------------------------------------------------------------
      # SECURITY: these defaults exist ONLY so a fresh clone boots with
      # `docker compose up`. They MUST be overridden in any non-developer
      # environment. The prod overlay (docker-compose.prod.yml) marks
      # SESSION_SECRET, ADMIN_PASSWORD, and POSTGRES_PASSWORD as required
      # (`:?` syntax) and refuses to start without them.
      # -------------------------------------------------------------------------
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # SECURITY: no default admin password. A known-password admin account
      # on a deployed stack is a critical hole — generate one before first
      # boot:  export ADMIN_PASSWORD=$(openssl rand -base64 24)
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required (generate with openssl rand -base64 24)}"
      DATABASE_URL: postgres://helm:${POSTGRES_PASSWORD:-helm_dev}@postgres:5432/helm
      REDIS_URL: redis://:${REDIS_PASSWORD:-helm_dev}@redis:6379/0
      # SESSION_SECRET intentionally empty here. The backend generates an
      # ephemeral in-memory secret on boot (logged as a warning) so a fresh
      # clone still boots with `docker compose up`. Set a strong value
      # (e.g. `openssl rand -hex 32`) for any real deployment; the prod
      # overlay requires it via `:?`.
      SESSION_SECRET: ${SESSION_SECRET:-}
      API_PORT: "3000"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      # Live-data web search. The api shell-spawns the `lightpanda`
      # binary by default; override LIGHTPANDA_BIN to point at a custom
      # path. To switch to a long-running Lightpanda daemon, set
      # WEB_SEARCH_LIGHTPANDA_URL=http://lightpanda:9222.
      LIGHTPANDA_BIN: lightpanda
      # Optional: pay-per-call providers (Brave / Tavily). Lightpanda is
      # the default; these only run if Lightpanda is disabled.  Keys are
      # configured in-app (admin API → web_search_keys table), not via
      # these env vars — they are kept for operator reference only.
    ports:
      - "3000:3000"

  # HELM frontend — production SPA serving. The web container serves
  # the built React app and reverse-proxies /api, /apps/:slug and
  # /apps-embed?slug=... to the api (mirroring the dev vite proxy in
  # frontend/vite.config.ts). Single-origin: the browser only talks to
  # this container, so the session cookie stays first-party.
  #
  # In production, drop the api's `ports:` block above and expose the
  # api only on the internal network — the web proxy is the only
  # front door (see docker-compose.prod.yml).
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      # No runtime config needed — the SPA talks to the api over
      # relative /api paths through this same origin.
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    ports:
      - "8080:8080"

volumes:
  helm_pg:
  helm_redis:
