<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily Standup — HELM</title>
  <style>
    :root {
      --bg: #0B0E12;
      --panel: #14171d;
      --panel-alt: #1a1e25;
      --panel-hi: #1f242c;
      --border: #2a2f38;
      --border-soft: #1f232a;
      --text: #e6e6e6;
      --text-muted: #9aa0a6;
      --text-faint: #6a707a;
      --brass: #C9A227;
      --brass-soft: #d6b94d;
      --brass-dim: rgba(201, 162, 39, 0.18);
      --teal: #4c9c90;
      --rust: #b5533c;
      --teal-dim: rgba(76, 156, 144, 0.18);
      --rust-dim: rgba(181, 83, 60, 0.18);
    }
    html[data-theme="light"] {
      --bg: #F5F1E8;
      --panel: #FBF7EE;
      --panel-alt: #EFE9D9;
      --panel-hi: #ECE5D2;
      --border: #C7BFA8;
      --border-soft: #DBD3BC;
      --text: #1f232a;
      --text-muted: #5b625d;
      --text-faint: #7d847b;
      --brass: #8a6d12;
      --brass-soft: #6e560b;
      --brass-dim: rgba(138, 109, 18, 0.18);
      --teal: #2d6b62;
      --rust: #8b3e2a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Fira Code", monospace;
      font-size: 13px;
      line-height: 1.55;
      min-height: 100vh;
    }
    .mono-caps {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .tabular { font-variant-numeric: tabular-nums; }

    .wrap {
      max-width: 1080px;
      margin: 32px auto;
      padding: 0 22px 80px;
    }
    .head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 16px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border-soft);
    }
    .head .icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--brass);
      color: var(--bg);
      flex-shrink: 0;
    }
    .head .title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text);
    }
    .head .who {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-muted);
      text-align: right;
    }
    .head .who .name { color: var(--text); font-weight: 600; }

    .no-install {
      margin-top: 22px;
      padding: 16px;
      border: 1px solid var(--rust-dim);
      background: var(--rust-dim);
      color: var(--rust);
      font-size: 12px;
    }
    .no-install code {
      background: var(--panel-alt);
      padding: 1px 6px;
      border: 1px solid var(--border-soft);
    }

    /* Range strip */
    .strip {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding: 8px 12px;
      background: var(--panel);
      border: 1px solid var(--border);
    }
    .strip label {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .strip select, .strip input {
      background: var(--panel-alt);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 5px 8px;
    }
    .strip select:focus, .strip input:focus { outline: 1px solid var(--brass); border-color: var(--brass); }
    .strip .grow { flex: 1; }
    .strip .stat {
      font-size: 11px;
      color: var(--text-faint);
      letter-spacing: 0.08em;
    }
    .strip .stat b { color: var(--text); font-weight: 600; }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 18px;
    }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

    /* LEFT — generated standup */
    .editor {
      border: 1px solid var(--border);
      background: var(--panel);
      padding: 22px 24px;
      min-height: 380px;
    }
    .editor h3 {
      margin: 0 0 4px;
      font-size: 17px;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .editor .sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 18px;
    }
    .editor-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-soft);
    }
    button {
      background: var(--brass);
      color: var(--bg);
      border: 1px solid var(--brass);
      padding: 8px 14px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 120ms;
    }
    button:hover { background: var(--brass-soft); border-color: var(--brass-soft); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.ghost {
      background: transparent;
      color: var(--text);
      border-color: var(--border);
    }
    button.ghost:hover { border-color: var(--brass); color: var(--brass); }
    button.small { padding: 5px 10px; font-size: 10px; letter-spacing: 0.16em; }

    /* Sections */
    .section {
      margin: 0 0 18px;
      padding: 0;
    }
    .section h4 {
      margin: 0 0 6px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--brass);
      font-weight: 600;
    }
    .section .bullets {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .section .bullets li {
      position: relative;
      padding: 4px 0 4px 18px;
      font-size: 13px;
      color: var(--text);
      line-height: 1.55;
    }
    .section .bullets li::before {
      content: "—";
      position: absolute;
      left: 0;
      color: var(--text-faint);
    }
    .section .bullets li.empty {
      color: var(--text-faint);
      font-style: italic;
      padding-left: 0;
    }
    .section .bullets li.empty::before { display: none; }

    .editor textarea {
      display: block;
      width: 100%;
      min-height: 320px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 14px 16px;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.6;
      resize: vertical;
    }
    .editor textarea:focus { outline: 1px solid var(--brass); border-color: var(--brass); }

    /* RIGHT — source attribution */
    .sources {
      border: 1px solid var(--border);
      background: var(--panel);
      padding: 18px;
      max-height: 720px;
      overflow-y: auto;
    }
    .sources h4 {
      margin: 0 0 10px;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-faint);
      font-weight: 600;
    }
    .src-panel {
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-soft);
    }
    .src-panel:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
    .src-panel h5 {
      margin: 0 0 6px;
      font-size: 12px;
      color: var(--brass);
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .src-panel .meta {
      font-size: 10px;
      color: var(--text-faint);
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .src-msg {
      font-size: 11px;
      color: var(--text-muted);
      padding: 6px 8px;
      margin-bottom: 4px;
      background: var(--panel-alt);
      border-left: 2px solid var(--border);
    }
    .src-msg .sender {
      color: var(--text);
      font-weight: 600;
      margin-right: 6px;
      font-size: 10px;
      letter-spacing: 0.06em;
    }
    .src-msg .when {
      color: var(--text-faint);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-left: 6px;
    }

    /* Post-back selector */
    .post-zone {
      margin-top: 18px;
      padding: 14px;
      border: 1px solid var(--border-soft);
      background: var(--bg);
    }
    .post-zone h4 {
      margin: 0 0 8px;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-faint);
    }
    .post-zone .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .post-zone select {
      flex: 1;
      background: var(--panel-alt);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 6px 8px;
    }

    /* Chips */
    .chip {
      display: inline-block;
      padding: 3px 8px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: 1px solid;
    }
    .chip-err { color: var(--rust); border-color: var(--rust-dim); background: var(--rust-dim); }
    .chip-ok { color: var(--teal); border-color: var(--teal-dim); background: var(--teal-dim); }
    .chip-mute { color: var(--text-faint); border-color: var(--border-soft); background: var(--panel-alt); }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 13px;
      background: var(--brass);
      vertical-align: -2px;
      margin-left: 2px;
      animation: blink 1s steps(2) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .loading-bar {
      display: inline-block;
      width: 8px;
      height: 13px;
      background: var(--brass);
      vertical-align: -2px;
      margin-left: 2px;
      animation: blink 1s steps(2) infinite;
    }
    .empty {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-faint);
      font-size: 12px;
      border: 1px dashed var(--border);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
          <rect x="3" y="4" width="18" height="16"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
          <line x1="9" y1="4" x2="9" y2="20"/>
          <line x1="15" y1="14" x2="15" y2="20"/>
          <line x1="15" y1="4" x2="15" y2="8"/>
        </svg>
      </div>
      <div>
        <div class="mono-caps">HELM · app</div>
        <div class="title">Daily Standup</div>
      </div>
      <div class="who" id="who">—</div>
    </div>

    <div id="root">loading…</div>
  </div>

  <script>
    /* ===================================================================
     * Daily Standup — reads recent messages from every panel the user is
     * a member of, asks the LLM to write a structured standup, lets the
     * user edit it, then post it back to a panel.
     * =================================================================== */

    const params = new URLSearchParams(location.search);
    const installIdFromUrl = params.get("install");

    const state = {
      sdk: null,
      install: installIdFromUrl,
      me: null,
      theme: "dark",
      range: "24h",              // "24h" | "3d" | "7d"
      panels: [],
      panelMessages: {},          // pid -> [msg]
      allMyMessages: [],          // flattened across panels
      modelId: null,
      streaming: false,
      streamBuffer: "",
      streamError: null,
      // The structured standup (rendered) — built from streamed text.
      sections: {
        wins: [],
        yesterday: [],
        today: [],
        blockers: [],
      },
      editing: false,
      editedText: "",
      saved: null,                // last saved version
      savedAt: null,
      destination: null,          // panel id to post to
      postStatus: null,
      postError: null,
      startedAt: null,
    };

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    function applyTheme(theme) {
      state.theme = theme === "light" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", state.theme);
    }

    async function waitForSDK(timeoutMs = 4000) {
      const start = Date.now();
      while (Date.now() - start < timeoutMs) {
        if (window.helmApp && window.helmApp.ready) {
          try { await window.helmApp.ready; return window.helmApp; }
          catch (_) {}
        }
        await new Promise((r) => setTimeout(r, 50));
      }
      return null;
    }

    async function bootstrapStandalone() {
      if (!installIdFromUrl) return null;
      try {
        const r = await fetch(`/api/apps/bootstrap?install=${encodeURIComponent(installIdFromUrl)}`, {
          credentials: "include",
        });
        if (!r.ok) return null;
        return await r.json();
      } catch (_) { return null; }
    }

    /* SDK wrappers + fallback */
    async function apiGet(path) {
      if (state.sdk && state.sdk.callAPI) return state.sdk.callAPI(path, { method: "GET" });
      const r = await fetch(`/api${path}`, { credentials: "include" });
      if (!r.ok) throw new Error(`${r.status} GET ${path}`);
      return r.json();
    }
    async function apiPost(path, body) {
      if (state.sdk && state.sdk.callAPI) return state.sdk.callAPI(path, { method: "POST", body });
      const r = await fetch(`/api${path}`, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!r.ok) {
        let msg; try { msg = (await r.json()).error; } catch { msg = await r.text(); }
        throw new Error(`${r.status} POST ${path} · ${msg}`);
      }
      return r.json();
    }
    async function dataGet(key) {
      if (state.sdk && state.sdk.data && state.sdk.data.get) {
        const r = await state.sdk.data.get(key);
        return r && r.value !== undefined ? r.value : r;
      }
      if (!state.install) return null;
      const r = await fetch(`/api/app-data/${state.install}/${encodeURIComponent(key)}`, { credentials: "include" });
      if (!r.ok) return null;
      return (await r.json()).value;
    }
    async function dataSet(key, value) {
      if (state.sdk && state.sdk.data && state.sdk.data.set) return state.sdk.data.set(key, value);
      if (!state.install) return;
      await fetch(`/api/app-data/${state.install}/${encodeURIComponent(key)}`, {
        method: "POST", credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ value }),
      });
    }
    function toast(opts) {
      if (state.sdk && state.sdk.toast) return state.sdk.toast(opts);
      console.log("[toast]", opts);
    }
    function copyText(text) {
      if (state.sdk && state.sdk.copy) return state.sdk.copy(text);
      try { return navigator.clipboard.writeText(text); } catch (_) { return Promise.reject(new Error("copy failed")); }
    }

    /* Parse the streamed LLM output into the four sections. */
    function parseStreamIntoSections(text) {
      const sects = { wins: [], yesterday: [], today: [], blockers: [] };
      if (!text) return sects;
      // The LLM is asked to emit headings like "**Yesterday:**" / "**Today:**" / "**Blockers:**" / "**Wins:**".
      const lines = text.split(/\r?\n/);
      let current = null;
      const labelMap = {
        yesterday: "yesterday", yest: "yesterday", done: "yesterday", accomplished: "yesterday",
        today: "today", plan: "today", next: "today", now: "today",
        blockers: "blockers", blocked: "blockers", risks: "blockers", issues: "blockers",
        wins: "wins", win: "wins", progress: "wins", highlights: "wins",
      };
      const start = (line) => {
        const m = line.match(/^\s*[\*\-#]*\s*(?:\*\*)?([A-Za-z]+)(?:\*\*)?\s*[:\-]\s*(.*)$/);
        if (!m) return null;
        const key = labelMap[m[1].toLowerCase()];
        if (!key) return null;
        return { key, rest: m[2] };
      };
      for (const line of lines) {
        const s = start(line);
        if (s) { current = s.key; if (s.rest && s.rest.trim()) sects[current].push(s.rest.trim()); continue; }
        if (!current) continue;
        const bullet = line.replace(/^\s*[\-*·]\s*/, "").trim();
        if (bullet) sects[current].push(bullet);
      }
      // If the model never used a heading, dump everything into yesterday.
      const total = sects.wins.length + sects.yesterday.length + sects.today.length + sects.blockers.length;
      if (total === 0) {
        const all = text.split(/\r?\n/).map((l) => l.replace(/^\s*[\-*·]\s*/, "").trim()).filter(Boolean);
        sects.yesterday = all;
      }
      return sects;
    }

    function sectionsToText(sects) {
      const block = (label, items) => {
        if (!items || items.length === 0) return `**${label}:**\n- none`;
        return `**${label}:**\n${items.map((b) => `- ${b}`).join("\n")}`;
      };
      return [
        block("Wins", sects.wins),
        block("Yesterday", sects.yesterday),
        block("Today", sects.today),
        block("Blockers", sects.blockers),
      ].join("\n\n");
    }

    /* SSE stream */
    async function generateStandup() {
      const ms = state.allMyMessages;
      if (ms.length === 0) {
        state.streamError = "no recent messages across any panel — nothing to summarize";
        paint();
        return;
      }
      if (!state.modelId) {
        state.streamError = "no model available — you need at least one assigned model";
        paint();
        return;
      }

      state.streaming = true;
      state.streamBuffer = "";
      state.streamError = null;
      state.startedAt = Date.now();
      state.sections = { wins: [], yesterday: [], today: [], blockers: [] };
      paint();

      // Group messages by panel for richer context.
      const byPanel = {};
      for (const m of ms) {
        (byPanel[m.panel_id] ||= []).push(m);
      }
      const context = Object.entries(byPanel).map(([pid, list]) => {
        const p = state.panels.find((p) => p.id === pid);
        const pname = p ? p.name : "panel";
        const bullets = list.map((m) =>
          `  - [${new Date(m.created_at).toLocaleString([], { hour: "2-digit", minute: "2-digit", month: "short", day: "numeric" })}] ${(m.content || "").replace(/\s+/g, " ").slice(0, 600)}`
        ).join("\n");
        return `Panel: ${pname}\n${bullets}`;
      }).join("\n\n");

      const sys =
        "You are writing a daily standup update for a team member, based on their recent " +
        "messages grouped by panel. Produce exactly four sections in this exact order, with no " +
        "extra prose, no greeting, no signature:\n\n" +
        "**Wins:**\n- <bullets describing concrete progress / completed items noticed in the messages>\n\n" +
        "**Yesterday:**\n- <bullets describing what they did or shipped in the past day>\n\n" +
        "**Today:**\n- <bullets describing what they plan to do next, based on momentum in the messages>\n\n" +
        "**Blockers:**\n- <bullets describing anything blocking them, or 'none' if no blockers>\n\n" +
        "Be specific. Quote concrete details from the messages. Keep each bullet under 22 words. " +
        "Attribute work to its panel when relevant (e.g. 'in the Billing panel, ...'). " +
        "If a section has no material, write 'none' for that section. Output only the four headings and bullets — no preamble.";

      const content =
        `Here are my ${ms.length} recent messages across ${Object.keys(byPanel).length} panel(s) for the past ${state.range}. ` +
        `Write my standup in the four sections (Wins, Yesterday, Today, Blockers).\n\n${context}`;

      let resp;
      try {
        resp = await fetch("/api/chat", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model_id: state.modelId, system: sys, content }),
        });
      } catch (e) {
        state.streaming = false;
        state.streamError = String(e.message || e);
        paint();
        return;
      }
      if (!resp.ok) {
        let msg = `${resp.status}`;
        try { msg = (await resp.json()).error || msg; } catch (_) {}
        state.streaming = false;
        state.streamError = `chat failed · ${msg}`;
        paint();
        return;
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      let assembled = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) !== -1) {
          const frame = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          const ev = parseSSE(frame);
          if (!ev) continue;
          if (ev.event === "token") {
            try {
              const j = JSON.parse(ev.data);
              if (j.delta) {
                assembled += j.delta;
                state.streamBuffer = assembled;
                state.sections = parseStreamIntoSections(assembled);
                paint({ keepScroll: true });
              }
            } catch (_) {}
          } else if (ev.event === "error") {
            try { state.streamError = (JSON.parse(ev.data)).message || "stream error"; }
            catch (_) { state.streamError = "stream error"; }
          }
        }
      }
      state.streaming = false;
      state.streamBuffer = assembled;
      state.sections = parseStreamIntoSections(assembled);
      paint();
    }

    function parseSSE(frame) {
      let event = "message";
      let data = "";
      for (const line of frame.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) data += line.slice(5).trim();
      }
      if (!data) return null;
      return { event, data };
    }

    async function saveStandup() {
      const text = state.editedText || sectionsToText(state.sections);
      const today = new Date().toISOString().slice(0, 10);
      const saved = { text, sections: state.sections, saved_at: new Date().toISOString(), range: state.range };
      state.saved = saved;
      state.savedAt = saved.saved_at;
      await dataSet(`standup-${today}`, saved);
      state.editing = false;
      toast({ tone: "success", title: "standup saved" });
      paint();
    }

    async function postToPanel() {
      const dest = state.destination;
      if (!dest) {
        state.postError = "pick a destination panel";
        paint();
        return;
      }
      const text = state.saved?.text || state.editedText || sectionsToText(state.sections);
      if (!text.trim()) {
        state.postError = "nothing to post";
        paint();
        return;
      }
      state.postStatus = "posting";
      state.postError = null;
      paint();
      try {
        // /api/panels/:id/messages does not support POST — chat goes over
        // WebSocket. If the SDK has a "sendPanelMessage" seam, use it.
        // Otherwise write the post via the host's WS bridge if exposed.
        // Fallback: try the SDK method, then fall back to a clipboard +
        // toast message letting the user know to paste.
        if (state.sdk && state.sdk.sendPanelMessage) {
          await state.sdk.sendPanelMessage(dest, text);
        } else {
          await copyText(text);
          state.postStatus = "copied";
          toast({
            tone: "info",
            title: "copied to clipboard",
            description: "paste into the panel — messages go over WebSocket, not HTTP.",
          });
          paint();
          return;
        }
        state.postStatus = "posted";
        toast({ tone: "success", title: "posted to panel" });
        // record the post
        const today = new Date().toISOString().slice(0, 10);
        const sent = (state.saved && state.saved.posted_to) || [];
        sent.push({ panel_id: dest, at: new Date().toISOString() });
        await dataSet(`standup-${today}-posts`, sent);
      } catch (e) {
        state.postStatus = null;
        state.postError = String(e.message || e);
        toast({ tone: "error", title: "post failed", description: state.postError });
      }
      paint();
    }

    /* ===================================================================
     * Paint
     * =================================================================== */
    function renderBullets(items, emptyText) {
      if (!items || items.length === 0) return `<li class="empty">${escapeHtml(emptyText)}</li>`;
      return items.map((b) => `<li>${escapeHtml(b)}</li>`).join("");
    }

    function paint() {
      const who = document.getElementById("who");
      who.innerHTML = state.me
        ? `<div class="name">${escapeHtml(state.me.name || state.me.username)}</div><div>${escapeHtml(state.me.role)} · ${new Date().toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })}</div>`
        : "—";

      const root = document.getElementById("root");

      if (!state.install) {
        root.innerHTML = `
          <div class="no-install">
            <strong>no install context.</strong>
            open this app from the HELM admin <em>Apps</em> tab or via a panel that has it installed.
            the SDK or <code>?install=&lt;uuid&gt;</code> supplies the install id.
          </div>`;
        return;
      }

      // Range strip
      const total = state.allMyMessages.length;
      const panels = state.panels.length;
      const strip = `
        <div class="strip">
          <label>range</label>
          <select id="range">
            <option value="24h" ${state.range === "24h" ? "selected" : ""}>last 24h</option>
            <option value="3d" ${state.range === "3d" ? "selected" : ""}>last 3 days</option>
            <option value="7d" ${state.range === "7d" ? "selected" : ""}>last 7 days</option>
          </select>
          <span class="grow"></span>
          <span class="stat tabular"><b>${total}</b> msg · <b>${panels}</b> panel${panels === 1 ? "" : "s"}</span>
        </div>`;

      // Editor
      let editorBody;
      if (state.editing) {
        const initial = state.editedText || sectionsToText(state.sections);
        editorBody = `
          <textarea id="edit" spellcheck="false">${escapeHtml(initial)}</textarea>
        `;
      } else if (state.streaming) {
        const sects = state.sections;
        const hasAny = (sects.wins.length + sects.yesterday.length + sects.today.length + sects.blockers.length) > 0;
        editorBody = hasAny
          ? `
            <div class="section">
              <h4>Wins</h4>
              <ul class="bullets">${renderBullets(sects.wins, "none yet")}</ul>
            </div>
            <div class="section">
              <h4>Yesterday</h4>
              <ul class="bullets">${renderBullets(sects.yesterday, "none yet")}</ul>
            </div>
            <div class="section">
              <h4>Today</h4>
              <ul class="bullets">${renderBullets(sects.today, "none yet")}</ul>
            </div>
            <div class="section">
              <h4>Blockers</h4>
              <ul class="bullets">${renderBullets(sects.blockers, "none")}</ul>
            </div>
            <div class="chip chip-mute"><span class="loading-bar"></span> streaming…</div>
          `
          : `<div class="chip chip-mute"><span class="loading-bar"></span> drafting your standup…</div>`;
      } else {
        const sects = state.sections;
        const hasAny = (sects.wins.length + sects.yesterday.length + sects.today.length + sects.blockers.length) > 0;
        if (!hasAny) {
          editorBody = `
            <div class="empty">
              <div style="font-size:14px;color:var(--text);margin-bottom:6px;">no standup yet</div>
              <div>press <b>generate</b> to summarize your last ${state.range} of messages.<br>or write your own — click <b>edit</b> to start blank.</div>
            </div>
          `;
        } else {
          editorBody = `
            <div class="section">
              <h4>Wins</h4>
              <ul class="bullets">${renderBullets(sects.wins, "none")}</ul>
            </div>
            <div class="section">
              <h4>Yesterday</h4>
              <ul class="bullets">${renderBullets(sects.yesterday, "none")}</ul>
            </div>
            <div class="section">
              <h4>Today</h4>
              <ul class="bullets">${renderBullets(sects.today, "none")}</ul>
            </div>
            <div class="section">
              <h4>Blockers</h4>
              <ul class="bullets">${renderBullets(sects.blockers, "none")}</ul>
            </div>
          `;
        }
      }

      const status = state.streamError
        ? `<div class="chip chip-err" style="margin-top:14px;">error · ${escapeHtml(state.streamError)}</div>`
        : (state.savedAt && !state.streaming
            ? `<div class="chip chip-ok" style="margin-top:14px;">saved ${escapeHtml(new Date(state.savedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }))}</div>`
            : "");

      const postZone = `
        <div class="post-zone">
          <h4>post to panel</h4>
          <div class="row">
            <select id="dest">
              <option value="">— pick a panel —</option>
              ${state.panels.map((p) => `<option value="${escapeHtml(p.id)}" ${state.destination === p.id ? "selected" : ""}>${escapeHtml(p.name)}</option>`).join("")}
            </select>
            <button id="post" class="small" ${!state.destination || state.streaming ? "disabled" : ""}>post</button>
            <button id="copy" class="ghost small" ${(!state.saved && !state.editedText && !state.streamBuffer) ? "disabled" : ""}>copy</button>
          </div>
          ${state.postError ? `<div class="chip chip-err" style="margin-top:8px;">${escapeHtml(state.postError)}</div>` : ""}
          ${state.postStatus === "posted" ? `<div class="chip chip-ok" style="margin-top:8px;">posted</div>` : ""}
          ${state.postStatus === "copied" ? `<div class="chip chip-mute" style="margin-top:8px;">copied — paste into panel</div>` : ""}
        </div>`;

      const editor = `
        <section class="editor">
          <h3>${escapeHtml(new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }))}</h3>
          <div class="sub">standup from your last ${state.range} across ${panels} panel${panels === 1 ? "" : "s"}</div>
          <div class="editor-actions">
            <button id="gen" ${state.streaming ? "disabled" : ""}>${state.streaming ? "generating…" : "generate"}</button>
            <button id="edit" class="ghost" ${state.streaming ? "disabled" : ""}>${state.editing ? "cancel" : "edit"}</button>
            <button id="save" class="ghost" ${!state.editing || state.streaming ? "disabled" : ""}>save</button>
            <button id="reset" class="ghost" ${state.streaming ? "disabled" : ""}>clear</button>
          </div>
          ${editorBody}
          ${status}
          ${postZone}
        </section>`;

      // Sources (right rail)
      const byPanel = {};
      for (const m of state.allMyMessages) (byPanel[m.panel_id] ||= []).push(m);
      const sourcesHTML = Object.keys(byPanel).length === 0
        ? `<div class="empty">you haven't sent any messages in this range.</div>`
        : Object.entries(byPanel).map(([pid, list]) => {
          const p = state.panels.find((p) => p.id === pid);
          const name = p ? p.name : "panel";
          return `
            <div class="src-panel">
              <h5>${escapeHtml(name)}</h5>
              <div class="meta tabular">${list.length} msg${list.length === 1 ? "" : "s"}</div>
              ${list.slice(0, 6).map((m) => `
                <div class="src-msg">
                  <span class="sender">${escapeHtml(m.sender_name || "you")}</span>
                  ${escapeHtml((m.content || "").replace(/\s+/g, " ").slice(0, 200))}${(m.content || "").length > 200 ? "…" : ""}
                  <span class="when">${new Date(m.created_at).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })}</span>
                </div>
              `).join("")}
              ${list.length > 6 ? `<div class="meta" style="margin-top:4px;">+ ${list.length - 6} more</div>` : ""}
            </div>
          `;
        }).join("");

      const sources = `
        <aside class="sources">
          <h4>source · ${state.range}</h4>
          ${sourcesHTML}
        </aside>`;

      root.innerHTML = `${strip}<div class="grid">${editor}${sources}</div>`;

      // Wire up
      document.getElementById("range").onchange = (e) => {
        state.range = e.target.value;
        loadAndRefresh();
      };
      const gen = document.getElementById("gen");
      if (gen) gen.onclick = () => generateStandup();
      const ed = document.getElementById("edit");
      if (ed) ed.onclick = () => {
        if (state.editing) {
          state.editing = false;
          state.editedText = "";
        } else {
          state.editing = true;
          state.editedText = sectionsToText(state.sections);
        }
        paint();
        if (state.editing) {
          const ta = document.getElementById("edit");
          if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
        }
      };
      const sv = document.getElementById("save");
      if (sv) sv.onclick = () => saveStandup();
      const rs = document.getElementById("reset");
      if (rs) rs.onclick = () => {
        state.sections = { wins: [], yesterday: [], today: [], blockers: [] };
        state.editedText = "";
        state.streamBuffer = "";
        state.saved = null;
        state.savedAt = null;
        paint();
      };
      const dest = document.getElementById("dest");
      if (dest) dest.onchange = (e) => { state.destination = e.target.value; paint(); };
      const post = document.getElementById("post");
      if (post) post.onclick = () => postToPanel();
      const cp = document.getElementById("copy");
      if (cp) cp.onclick = async () => {
        const text = state.saved?.text || state.editedText || sectionsToText(state.sections);
        try {
          await copyText(text);
          toast({ tone: "success", title: "copied to clipboard" });
        } catch (e) {
          toast({ tone: "error", title: "copy failed" });
        }
      };
    }

    /* ===================================================================
     * Boot
     * =================================================================== */
    async function loadAndRefresh() {
      try {
        await loadMessagesAcrossPanels();
      } catch (e) {
        state.streamError = String(e.message || e);
      }
      paint();
    }

    async function pickModel() {
      try {
        const models = await apiGet("/models");
        const assigned = models.find((m) => m.assigned && m.state === "active");
        const any = models.find((m) => m.state === "active");
        return (assigned || any || {}).id || null;
      } catch (_) { return null; }
    }

    async function loadPanels() {
      state.panels = await apiGet("/panels");
    }

    async function loadMessagesAcrossPanels() {
      const rangeMs = state.range === "24h" ? 24*3600e3 : state.range === "3d" ? 3*24*3600e3 : 7*24*3600e3;
      const since = Date.now() - rangeMs;
      const results = await Promise.all(state.panels.map(async (p) => {
        try {
          const msgs = await apiGet(`/panels/${p.id}/messages?limit=100`);
          const mine = msgs.filter((m) =>
            state.me && m.user_id === state.me.id && new Date(m.created_at).getTime() >= since
          );
          // Keep attribution by panel (add panel_id to each message).
          return mine.map((m) => ({ ...m, panel_id: p.id, panel_name: p.name }));
        } catch (_) { return []; }
      }));
      state.allMyMessages = results.flat().sort((a, b) =>
        new Date(a.created_at).getTime() - new Date(b.created_at).getTime()
      );
    }

    async function loadSavedStandup() {
      const today = new Date().toISOString().slice(0, 10);
      const v = await dataGet(`standup-${today}`);
      if (v && v.text) {
        state.saved = v;
        state.savedAt = v.saved_at;
        if (v.sections) state.sections = v.sections;
        if (v.text) state.editedText = v.text;
      }
    }

    async function boot() {
      const sdk = await waitForSDK();
      state.sdk = sdk;
      if (sdk) {
        if (sdk.me) state.me = sdk.me;
        if (sdk.theme) applyTheme(sdk.theme);
        if (!state.install && sdk.install) state.install = sdk.install;
        if (sdk.onThemeChange) sdk.onThemeChange(applyTheme);
      } else {
        const b = await bootstrapStandalone();
        if (b) {
          if (b.me) state.me = b.me;
          if (b.install_id) state.install = b.install_id;
          if (b.theme) applyTheme(b.theme);
        }
        const mql = window.matchMedia("(prefers-color-scheme: light)");
        mql.addEventListener("change", (e) => applyTheme(e.matches ? "light" : "dark"));
        applyTheme(mql.matches ? "light" : "dark");
      }

      if (!state.install) { paint(); return; }

      state.modelId = await pickModel();
      try {
        await loadPanels();
        await loadMessagesAcrossPanels();
        await loadSavedStandup();
      } catch (e) {
        state.streamError = String(e.message || e);
      }
      paint();
    }

    boot().catch((e) => {
      state.streamError = String(e.message || e);
      paint();
    });
  </script>
</body>
</html>
